# vmware-migration-agent — runtime configuration
# All agent behaviour is controlled from here. No hardcoded values in source code.

# ─── GENERATION ─────────────────────────────────────────────────────────────
generation:
  # deterministic: render Terraform from the provider templates in providers/ (no LLM, no MCP,
  #                no API key). Output is reproducible and diffable between runs.
  # llm:           the LLM writes the HCL from the CIM (requires llm.* and, if enabled, MCP).
  # hybrid:        deterministic first; if its output fails validation the LLM loop runs with
  #                the deterministic errors as feedback.
  mode: deterministic

# ─── LLM (used by llm/hybrid generation and for review notes) ────────────────
llm:
  # provider: anthropic | openai | google
  provider: anthropic

  # Model per provider — change here, not in code
  # anthropic: claude-opus-5 (default quality) or claude-sonnet-5 (lower cost)
  models:
    anthropic: claude-opus-5
    openai: gpt-4o
    google: gemini-2.0-flash

  # Temperature rules — do not raise these values
  # HCL generation must be deterministic.
  # Note: Claude 5-family models reject sampling parameters, so temperature is only
  # sent to the openai and google providers; determinism on Anthropic comes from the
  # prompt contract and the deterministic validation loop.
  temperature_hcl: 0.0
  # Report/review notes can be slightly more natural
  temperature_report: 0.2

  max_tokens: 8192
  timeout_seconds: 120

# ─── TARGET CLOUD ────────────────────────────────────────────────────────────
# aws | azure | gcp | openstack
target_cloud: aws

# ─── PIPELINE BEHAVIOUR ──────────────────────────────────────────────────────
pipeline:
  # How many ComputeUnits to process per LangGraph batch execution
  batch_size: 50

  # Max LLM retry attempts per resource before quarantining
  max_retries: 3

  # Stop the entire run if more than this % of resources are blocked
  # Set to 1.0 to never stop (process all clean resources regardless)
  abort_threshold_pct: 0.5

# ─── VALIDATION ──────────────────────────────────────────────────────────────
validation:
  run_terraform_validate: true
  run_tflint: true
  run_opa: true

  # Path to terraform binary (must be in container image)
  terraform_bin: terraform

  # Path to tflint binary
  tflint_bin: tflint

  # OPA server mode or binary mode
  # binary: runs `opa eval` locally (default for CI)
  # server: calls OPA server at opa_server_url
  opa_mode: binary
  opa_bin: opa
  opa_server_url: ""  # only used if opa_mode = server

  # Path to .rego policy bundle
  policies_dir: validation/policies

  # Terraform provider plugin cache shared across validation runs (avoids re-downloading
  # providers on every attempt). Empty disables the cache.
  terraform_plugin_cache_dir: ~/.cache/vmware-migration-agent/terraform-plugins

# ─── MCP DOCUMENTATION CONTEXT ───────────────────────────────────────────────
mcp:
  # true: retrieve Terraform Registry docs via the MCP server (requires the docker CLI and a daemon).
  # false: skip retrieval; hcl_generator runs without documentation context.
  # The terragen --no-mcp flag sets this to false for one run.
  enabled: true
  tool_timeout_seconds: 30
  terraform:
    # Pinned by tag and multi-arch index digest (2026-08-26 release). Update both together.
    image: "hashicorp/terraform-mcp-server:1.3.0@sha256:423a6b8e2ee06affcf090892f40c86469caba45fd2448ffa8ca5d717a174f7d5"
    toolsets: "registry"

# ─── OUTPUT ──────────────────────────────────────────────────────────────────
output:
  base_dir: output/

  # Deterministic mode writes one flat Terraform root module per provider:
  #   {provider}-migration/providers.tf, variables.tf,
  #   {provider}-migration/{resource_type}_{name}.tf   (e.g. aws-migration/networking_vpc.tf,
  #                                                     aws-migration/compute_web-01.tf)
  # resource_type values: networking | compute | storage | placement
  # (llm mode keeps its own module layout; this value is informational.)
  structure: "{provider}-migration/{resource_type}_{name}.tf"

  write_quarantine_report: true
  quarantine_report_filename: quarantine_report.json

  write_review_notes: true
  review_notes_filename: review_notes.md

  # Written by the `assess` command
  assessment_report_json_filename: assessment_report.json
  assessment_report_markdown_filename: assessment_report.md

  # Overwrite existing files in output/ (set false to protect manual edits)
  overwrite: true

  # When true, no files are written at all (set by the terragen --dry-run flag)
  dry_run: false

# ─── VSPHERE MAPPING ─────────────────────────────────────────────────────────
vsphere:
  # DRS rule type strings as they appear in VMware API
  # Maps to ClusterSemantics enum in cim/schema.py
  drs_rule_mapping:
    ShouldRunOnSameHost: affinity
    ShouldNotRunOnSameHost: anti_affinity
    MustRunOnSameHost: affinity
    MustNotRunOnSameHost: anti_affinity

  # VMware blockers that cause quarantine (no HCL generated)
  hard_blockers:
    - encrypted_vm_present
    - rdm_disk_present
    - shared_disk_present

  # VMware blockers that cause needs_review (HCL generated with TODO comments)
  soft_blockers:
    - vtpm_present
    - mounted_iso_present
    - vapp_config_present

# ─── TAGGING ─────────────────────────────────────────────────────────────────
# These tags are injected into every generated resource
# Values are templates — {variable} substituted at generation time
required_tags:
  Environment: "{environment}"          # passed via CLI flag
  Owner: "{owner}"                      # passed via CLI flag
  MigratedFrom: "vmware-vcenter"
  MigrationTool: "vmware-migration-agent"
  SourceVCenter: "{source_vcenter}"     # from discovery JSON metadata
  GeneratedAt: "{generated_at}"         # ISO timestamp

# ─── LOGGING ─────────────────────────────────────────────────────────────────
logging:
  # loguru level: TRACE | DEBUG | INFO | WARNING | ERROR
  level: INFO
  # json: structured JSON logs for CI/CD pipelines
  # console: human-readable for local development
  format: console
  # Optional second sink: keep structured logs for debugging while console stays readable
  detailed_log_file: app-logs.txt
  detailed_log_level: TRACE