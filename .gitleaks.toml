# gitleaks configuration: extend the default rules, allow the documented test fixtures.
[extend]
useDefault = true

[allowlist]
description = "Dummy credentials used by the unit tests and the end-to-end launcher"
paths = [
  '''tests/services/test_connections\.py''',
  '''tests/api/test_connections_api\.py''',
]
regexes = [
  '''sp-secret-value''',
  # throwaway admin password of the screenshot script, used only against a temporary local server
  '''correct-horse-battery-staple-42''',
  # the documented TEST-ONLY Fernet key of the e2e launcher and CI (ui/e2e/serve.py, ci.yml)
  '''Qh40Wvj8j_NWRxw2EUSyCZWB7H40nhwqeYcAoniaOJ8=''',
  '''-----BEGIN PRIVATE KEY-----\\n(MIIE|abc)\\n''',
]
