[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hopshift"
version = "0.1.0"
description = "Migrate infrastructure from any source to any target: discovery to a canonical model, validated Terraform, compliance, human approval, deployment."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "blacksoxx" }]
keywords = ["migration", "terraform", "vmware", "proxmox", "aws", "azure", "gcp", "openstack", "infrastructure-as-code", "compliance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "langgraph>=0.2",
  "pydantic>=2,<3",
  "click>=8",
  "loguru>=0.7",
  "anthropic>=0.34",
  "openai>=1.0",
  "google-genai>=1.0",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "rich>=13.0",
  # <8: python-hcl2 8.x ships a stray top-level package named `cli` that shadows ours.
  "python-hcl2>=4.3,<8",
  "langgraph-checkpoint-sqlite>=2.0",
  # platform (API, security, connections, deployments)
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "cryptography>=43",
  "argon2-cffi>=23",
  "pyotp>=2.9",
  "authlib>=1.3",
  "boto3>=1.35",
  "azure-identity>=1.19",
  "google-auth>=2.35",
]

[project.urls]
Homepage = "https://github.com/blacksoxx/hopshift"
Documentation = "https://github.com/blacksoxx/hopshift/tree/main/docs"
Issues = "https://github.com/blacksoxx/hopshift/issues"
Changelog = "https://github.com/blacksoxx/hopshift/releases"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.0",
  "ruff>=0.6",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
  "uv>=0.5",
]
# kept for compatibility with earlier instructions (`pip install '.[api]'`); the API is core now
api = []
# the experimental rag_retriever node (not in the active graph) needs a vector store
rag = [
  "chromadb>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["hopshift*"]
namespaces = true

[tool.setuptools.package-data]
"hopshift.validation" = ["policies/*.rego", "policies/**/*.rego"]
"hopshift.cim" = ["*.json"]
# the conformance kit ships its discovery fixture so plugin repositories can run it without this checkout
"hopshift.testing" = ["fixtures/*.json"]

[project.scripts]
hopshift = "hopshift.cli.main:main"

# pytest fixtures for plugin repositories: hopshift_target_conformance, hopshift_source_conformance,
# hopshift_discovery_fixture (see docs/plugins.md)
[project.entry-points.pytest11]
hopshift = "hopshift.testing.pytest_plugin"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".claude", "ui", "output", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"hopshift/pipeline/llm_client.py" = ["E731"]  # provider dispatch table of lambdas

[tool.coverage.run]
source = ["hopshift"]
omit = ["*/__pycache__/*", "hopshift/pipeline/nodes/rag_retriever.py"]
relative_files = true

[tool.coverage.report]
skip_empty = true
show_missing = false
