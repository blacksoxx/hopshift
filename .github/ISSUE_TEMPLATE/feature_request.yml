name: Feature request
description: Propose an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Sketch the UI or API if relevant.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Pipeline / generated Terraform, UI, API, CLI, Connections, Deployments, Compliance policies, New cloud provider, New source hypervisor, Docs]
