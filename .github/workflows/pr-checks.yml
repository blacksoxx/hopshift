# Pull request hygiene: conventional titles, labels by touched area, and a dependency review
# that blocks newly introduced vulnerable or copyleft-licensed packages.
# Uses `pull_request` (not `pull_request_target`, which GitHub is phasing out for public
# repositories): same-repository branches get labels; fork PRs are still title- and
# dependency-checked with the read-only token.
name: Pull request checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            chore
            refactor
            ci
            build
            perf
            security
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: 'Start the subject with a lowercase letter, e.g. "feat(ui): add run filters".'

  label:
    name: Label by area
    if: github.event.pull_request.head.repo.full_name == github.repository   # forks have a read-only token
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          deny-licenses: GPL-3.0, AGPL-3.0, SSPL-1.0
