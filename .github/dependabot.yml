version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      python-minor:
        update-types: [minor, patch]
    ignore:
      # 8.x ships a stray top-level `cli` package that shadows ours (see pyproject.toml)
      - dependency-name: python-hcl2
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      ui-minor:
        update-types: [minor, patch]
    ignore:
      # the build toolchain moves together (Vite, Vitest, React plugin, TypeScript, jsdom, Testing Library);
      # majors are upgraded deliberately in one change, not one package at a time
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(deps)"
    ignore:
      # Node 22 is the LTS the CI matrix uses; move the build stage with the matrix, not alone
      - dependency-name: node
        update-types: ["version-update:semver-major"]
