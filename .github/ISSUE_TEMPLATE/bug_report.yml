name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got. Include the exact error text.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Pipeline / generated Terraform, UI, API, CLI, Connections, Deployments, Compliance policies, Container / compose, Docs]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.3.0 or a commit sha
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, a minimal discovery JSON (redact hostnames), the target cloud and run options.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from the server log, the run log tab or the deployment log. Redact credentials.
      render: shell
