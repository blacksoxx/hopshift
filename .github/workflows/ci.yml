name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.17.1"
  TFLINT_VERSION: "v0.66.0"
  OPA_VERSION: "1.22.2"
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint (ruff, pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (hash-pinned lock, then the package itself)
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e .
      - run: ruff check . --output-format github
      - name: pre-commit hooks (gitleaks runs in the security job)
        run: SKIP=gitleaks pre-commit run --all-files --show-diff-on-failure

  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    permissions:
      contents: write        # coverage badge data branch (main only)
      pull-requests: write   # coverage comment on pull requests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (hash-pinned lock, then the package itself)
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e .
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        if: runner.os == 'Linux'   # policy tests skip without the binary; macOS covers the Python side
        with:
          version: ${{ env.OPA_VERSION }}
      - name: Unit tests with coverage
        run: pytest -q --ignore=tests/integration --cov --cov-report=term-missing:skip-covered
      - name: Coverage comment and badge
        id: coverage_comment
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: py-cov-action/python-coverage-comment-action@50d15ff8768f6d897b04e5a0805bd1a98f7096c4 # v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60
      - name: Store the coverage comment for pull requests from forks
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt

  integration:
    name: Integration (terraform, tflint, OPA on all clouds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (hash-pinned lock, then the package itself)
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e .
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: ${{ env.OPA_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/hopshift/terraform-plugins
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('hopshift/targets/*/runtime.py') }}
      - run: pytest -q tests/integration

  ui:
    name: UI (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run --coverage
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-coverage
          path: ui/coverage
          retention-days: 7

  e2e:
    name: End-to-end (browser against a real server)
    runs-on: ubuntu-latest
    needs: [ui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (hash-pinned lock, then the package itself)
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/dist
      - run: npm ci
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npx playwright test
        working-directory: ui
        env:
          HOPSHIFT_SECRET_KEY: ${{ secrets.HOPSHIFT_E2E_SECRET_KEY || 'LBG8NBG1A01nCYAz5Yf0a6_Tr4eq6lZ95uKwzE3TDIM=' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report
          retention-days: 7

  security:
    name: Security (secrets, dependencies, static analysis, IaC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (hash-pinned lock, then the package itself)
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e .
      - name: Python dependency audit (pip-audit)
        run: pip-audit --progress-spinner off --desc on || echo "::warning::pip-audit reported findings; review the log"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: UI dependency audit (npm audit)
        run: npm audit --audit-level=high
        working-directory: ui
      - name: Static analysis (semgrep)
        run: |
          semgrep scan --config p/python --config p/typescript --config p/secrets \
            --severity ERROR --error --metrics=off \
            --exclude ui/node_modules --exclude .venv --exclude output --exclude ui/dist
      - name: "Filesystem scan (trivy: lockfiles, IaC misconfiguration, secrets)"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: ui/node_modules,.venv,output,ui/dist
          format: sarif
          output: trivy-fs.sarif
          exit-code: "1"
          # the SARIF upload must honour the severity filter, otherwise every finding lands in code scanning
          limit-severities-for-sarif: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: trivy-fs.sarif

  docker:
    name: Container (build, smoke test, image scan)
    runs-on: ubuntu-latest
    needs: [ui]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: hopshift:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm hopshift:ci python -m hopshift.cli.main --help
          docker run --rm hopshift:ci terraform version
          docker run --rm hopshift:ci opa version
          docker run --rm hopshift:ci id -u | grep -qx 10001
      - name: "Image scan (trivy: fixed critical vulnerabilities only)"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hopshift:ci
          severity: CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
          limit-severities-for-sarif: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: trivy-image.sarif

  all-green:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [lint, python, integration, ui, e2e, security, docker]
    if: always()
    steps:
      - name: Verify every job succeeded
        run: |
          echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")' > /dev/null
