# Pull request hygiene: conventional titles, labels by touched area, and a dependency review
# that blocks newly introduced vulnerable or copyleft-licensed packages.
# Uses `pull_request` (not `pull_request_target`, which GitHub is phasing out for public
# repositories): same-repository branches get labels; fork PRs are still title- and
# dependency-checked with the read-only token.
name: Pull request checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            chore
            refactor
            ci
            build
            perf
            security
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: 'Start the subject with a lowercase letter, e.g. "feat(ui): add run filters".'

  label:
    name: Label by area
    if: github.event.pull_request.head.repo.full_name == github.repository   # forks have a read-only token
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7.0.0
        with:
          sync-labels: true

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          deny-licenses: GPL-3.0, AGPL-3.0, SSPL-1.0
