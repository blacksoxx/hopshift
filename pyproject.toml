[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vmware-migration-agent"
version = "0.3.0"
description = "VMware discovery JSON to cloud Terraform HCL migration agent"
readme = "AGENTS.md"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=0.2",
  "pydantic>=2,<3",
  "click>=8",
  "loguru>=0.7",
  "anthropic>=0.34",
  "openai>=1.0",
  "google-genai>=1.0",
  "chromadb>=0.5",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "rich>=13.0",
  # <8: python-hcl2 8.x ships a stray top-level package named `cli` that shadows ours.
  "python-hcl2>=4.3,<8",
  "langgraph-checkpoint-sqlite>=2.0",
  # platform (API, security, connections, deployments)
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "cryptography>=43",
  "argon2-cffi>=23",
  "pyotp>=2.9",
  "authlib>=1.3",
  "boto3>=1.35",
  "azure-identity>=1.19",
  "google-auth>=2.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.0",
  "ruff>=0.6",
  "pip-audit>=2.7",
]
# kept for compatibility with earlier instructions (`pip install '.[api]'`); the API is core now
api = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "agent*",
  "cim*",
  "cli*",
  "providers*",
  "validation*",
  "vma*",
  "api*",
]
namespaces = true

[project.scripts]
vma = "cli.main:main"
