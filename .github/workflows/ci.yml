name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.8.5"
  TFLINT_VERSION: "v0.53.0"
  OPA_VERSION: "0.68.0"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  python:
    name: Python · lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: ${{ env.OPA_VERSION }}
      - run: pytest -q --ignore=tests/integration

  integration:
    name: Python · terraform, tflint and OPA on generated output
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: ${{ env.OPA_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vmware-migration-agent/terraform-plugins
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('providers/*/runtime.py') }}
      - run: pytest -q tests/integration

  ui:
    name: UI · typecheck, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 7

  e2e:
    name: End-to-end · browser against a real server
    runs-on: ubuntu-latest
    needs: [python, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - run: npm ci
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npx playwright test
        working-directory: ui
        env:
          VMA_SECRET_KEY: ${{ secrets.VMA_E2E_SECRET_KEY || 'Qh40Wvj8j_NWRxw2EUSyCZWB7H40nhwqeYcAoniaOJ8=' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report
          retention-days: 7

  security:
    name: Security · dependencies, secrets, filesystem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Python dependency audit (pip-audit)
        run: |
          pip install -e . pip-audit
          pip-audit --progress-spinner off --desc on || echo "::warning::pip-audit reported findings; review the log"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: UI dependency audit (npm audit)
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit reported findings; review the log"
        working-directory: ui
      - name: Filesystem scan (trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif

  docker:
    name: Container · build and scan
    runs-on: ubuntu-latest
    needs: [python, ui]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vmware-migration-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm vmware-migration-agent:ci python -m cli.main --help
          docker run --rm vmware-migration-agent:ci terraform version
          docker run --rm vmware-migration-agent:ci opa version
      - name: Image scan (trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vmware-migration-agent:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
